name: Test

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Zod ${{ matrix.zod-version }}${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zod-version: "4.3.6"
            label: ""
            test-script: test
          - zod-version: "4.5.2"
            label: " (compiled)"
            test-script: test:compiled
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun add --dev --no-save --exact zod@${{ matrix.zod-version }}
      - run: bun run check
      - run: bun run ${{ matrix.test-script }}

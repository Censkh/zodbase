name: Test

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Zod ${{ matrix.zod-version }}${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zod-version: "4.3.6"
            label: ""
            test-script: test:runtime
          - zod-version: "4.5.2"
            label: " (compiled)"
            test-script: test:runtime --compiled
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install
      - run: bun add --dev --no-save --exact zod@${{ matrix.zod-version }}
      - name: Checks and tests
        run: |
          bun run check &
          check_pid=$!
          bun run test:types &
          types_pid=$!
          bun run ${{ matrix.test-script }} &
          tests_pid=$!
          status=0
          wait "$check_pid" || status=1
          wait "$types_pid" || status=1
          wait "$tests_pid" || status=1
          exit "$status"
